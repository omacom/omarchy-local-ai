# The recommendation per hardware class, in order. `use best` picks the first recipe in the
# exact gpu/ram_class pair that fits the machine; later entries are fallbacks for static reasons only.
# A recipe may be listed only for classes it has a measurement record for.

[[class]]
gpu = "amd-strix-halo"
ram_class = 128
recipes = ["qwen3.8-flash-next-gufo", "qwen3.8-27b-gufo"]

# The N1x and the GB10 share these lists (GPU_CLASSES): only memory sets them apart.
[[class]]
gpu = "nvidia-gb10"
ram_class = 128
recipes = ["qwen3.8-flash-next-tensorfold", "nemotron-3.5-bolt-tensorfold", "qwen3.8-27b-tensorfold"]

[[class]]
gpu = "nvidia-gb10"
ram_class = 64
recipes = ["nemotron-3.5-bolt-tensorfold", "qwen3.8-27b-tensorfold"]

# Two DGX Sparks cabled through their ConnectX-7 ports: the pair's own class, tried before either Spark's own.
[[class]]
gpu = "nvidia-gb10-pair"
ram_class = 128
recipes = ["glm-5.3-flash-tensorfold-pair"]

# An RTX 3090 is classed by its 24 GB of VRAM, not by the machine's RAM. The prompt cache is off: its staging
# buffer doesn't fit beside the weights with a desktop on the card.
[[class]]
gpu = "nvidia-rtx3090"
vram_class = 24
recipes = ["nemotron-3.5-lightning-tensorfold", "lfm2.5-24b-a2b-tensorfold", "qwen3.5-2b-tensorfold"]
