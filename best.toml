# The recommendation per hardware class, in order. `use best` picks the first recipe in the
# exact gpu/ram_class pair that fits the machine; later entries are fallbacks for static reasons only.
# A recipe may be listed only for classes it has a measurement record for.
# `recipes` are text models: the agents' default and `use best`. `images` lists the image models
# recommended beside them, in the same order of preference, and never competes with `recipes`.

[[class]]
gpu = "amd-strix-halo"
ram_class = 128
recipes = ["qwen3.8-flash-next-gufo", "qwen3.8-27b-gufo"]

[[class]]
gpu = "amd-strix-halo"
ram_class = 64
recipes = ["qwen3.8-27b-gufo"]
images = ["flux2-klein-4b-sdcpp", "z-image-turbo-sdcpp"]

# The N1x and the GB10 share these lists (GPU_CLASSES): only memory sets them apart.
[[class]]
gpu = "nvidia-gb10"
ram_class = 128
recipes = ["qwen3.8-flash-next-tensorfold", "nemotron-3.5-bolt-tensorfold", "qwen3.8-27b-tensorfold"]

[[class]]
gpu = "nvidia-gb10"
ram_class = 64
recipes = ["nemotron-3.5-bolt-tensorfold", "qwen3.8-27b-tensorfold"]

# Two DGX Sparks cabled through their ConnectX-7 ports: the pair's own class, tried before either Spark's own.
[[class]]
gpu = "nvidia-gb10-pair"
ram_class = 128
recipes = ["glm-5.3-flash-tensorfold-pair", "deepseek-v4.1-flash-tensorfold-pair"]

# Apple Silicon under Asahi: Vulkan on the AGX GPU, with no ROCm or CUDA. Its single heap is half
# of RAM and the desktop draws from it too, so the light 4B comes first: a 32 GB machine keeps the
# 8B in reserve. Both fit a 32K-token context.
[[class]]
gpu = "apple-g13x"
ram_class = 32
recipes = ["qwen3-4b-llamacpp", "qwen3-8b-llamacpp"]
