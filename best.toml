# The recommendation per hardware class, in order. `use best` picks the first recipe in the
# gpu/ram_class pair that fits the machine; later entries are fallbacks for static reasons only.
# A bigger machine takes each kind's list from the nearest smaller class of its GPU that has one,
# until its own class lists that kind.
# Kept by hand, and what the agents panel puts forward: any recipe whose runtime runs on a machine
# and that fits it can be added from Local AI, but only these are recommended. A recipe may be listed
# only for GPUs it has a measurement record for.
# `recipes` are text models: the agents' default and `use best text`. `images`, `videos` and `music`
# list the models recommended beside them for each kind, `use best <kind>`, in the same
# order of preference, and never compete with `recipes` or each other.

# On 32 GB Strix Halo, Inkling 2 Mini's GSQ-RCO IQ3_S build fits in the ~23 GiB left beside
# the desktop (131K context via Vulkan RADV), alongside pictures and songs. Bigger Strix Halo
# classes inherit the image and music picks and switch text to Gufo.
[[class]]
gpu = "amd-strix-halo"
ram_class = 32
recipes = ["inkling-2-mini-llamacpp"]
images = ["flux2-klein-4b-sdcpp", "z-image-turbo-sdcpp"]
music = ["ace-step-1.5-turbo-acestep"]

# 27B also fits at 128 and 192 GB, but on agent work it is much weaker and slower, so those get
# Flash Next first with Inkling 2 Mini as the fast secondary option (192 GB inherits from 128 GB).
# At 64 GB Inkling 2 Mini leads: on Gufo 0.37 it loads in 31.4 GiB with a 256K window and decodes
# ~5x faster than Qwen3.8 27B on long prompts.
[[class]]
gpu = "amd-strix-halo"
ram_class = 128
recipes = ["qwen3.8-flash-next-gufo", "inkling-2-mini-gufo"]

[[class]]
gpu = "amd-strix-halo"
ram_class = 64
recipes = ["inkling-2-mini-gufo", "qwen3.8-27b-gufo"]
videos = ["minimax-h3-sdcpp"]

# The N1x and the GB10 share these lists (GPU_CLASSES): only memory sets them apart.
# 128 GB inherits images, videos and music from 64 GB.
[[class]]
gpu = "nvidia-gb10"
ram_class = 128
recipes = ["qwen3.8-flash-next-tensorfold", "inkling-2-mini-tensorfold"]

# Inkling 2 Mini leads at 64 GB: in a blind-judged run of Omarchy's theme, plugin, app and game make tasks it
# averaged 8.5 of 10 to Qwen3.8 27B's 8.0, at about 1.7 times its speed, and fits in 41 GiB with one stream.
# All four CUDA image, video and music models fit comfortably at 64 GB too (MiniMax H3 leaves 9.5 GiB free).
# Nemotron 3.5 Bolt, which scored 4.4 there, is retired.
[[class]]
gpu = "nvidia-gb10"
ram_class = 64
recipes = ["inkling-2-mini-tensorfold", "qwen3.8-27b-tensorfold"]
images = ["flux2-klein-4b-sdcpp-cuda", "z-image-turbo-sdcpp-cuda"]
videos = ["minimax-h3-sdcpp-cuda"]
music = ["ace-step-1.5-turbo-acestep-cuda"]

# Two DGX Sparks cabled through their ConnectX-7 ports: the pair's own class, tried before either Spark's own.
# DeepSeek V4.1 Flash decodes nearly twice as fast as GLM-5.3 Flash, leads it at coding and holds 1M tokens;
# GLM-5.3, which reads prompts faster and needs 13 GiB less on each Spark, is for a pair DeepSeek doesn't fit.
[[class]]
gpu = "nvidia-gb10-pair"
ram_class = 128
recipes = ["deepseek-v4.1-flash-tensorfold-pair", "glm-5.3-flash-tensorfold-pair"]

# On an Arc B390 a mixture-of-experts model is the sweet spot (a dense 27B runs at 5 tok/s).
# Inkling 2 Mini leads on agentic coding and vision (same model that beat Qwen3.8 27B at 64 GB NVIDIA)
# and ISTA-DASLab's GSQ-RCO IQ3_S build fits in 32 GB (~18 GiB at load, 131K context), alongside image
# and music generation via Vulkan. Bigger Arc B390 classes inherit these picks. Qwen3.6 35B-A3B is retired.
[[class]]
gpu = "intel-arc-b390"
ram_class = 32
recipes = ["inkling-2-mini-llamacpp"]
images = ["flux2-klein-4b-sdcpp", "z-image-turbo-sdcpp"]
music = ["ace-step-1.5-turbo-acestep"]

# On Strix Point (Ryzen AI 9 HX 370 / Radeon 890M), Inkling 2 Mini's GSQ-RCO IQ3_S build runs
# via Vulkan RADV in ~18 GiB at load (131K context on 32 GB, 256K on 64 GB), alongside image and
# music generation via Vulkan. 64 GB adds MiniMax H3 video generation (inheriting text, images
# and music from 32 GB).
[[class]]
gpu = "amd-strix-point"
ram_class = 32
recipes = ["inkling-2-mini-llamacpp"]
images = ["flux2-klein-4b-sdcpp", "z-image-turbo-sdcpp"]
music = ["ace-step-1.5-turbo-acestep"]

[[class]]
gpu = "amd-strix-point"
ram_class = 64
videos = ["minimax-h3-sdcpp"]
