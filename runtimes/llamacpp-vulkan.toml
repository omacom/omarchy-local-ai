# llama.cpp's llama-server (upstream ggml-org image, build b12464) with its Vulkan backend, for
# GPUs reached through Vulkan alone: Apple Silicon's AGX on Asahi Linux has no ROCm or CUDA. The
# image carries no weights; the model arrives read-only at /models. The engine substitutes the key
# inside the container as LLAMA_API_KEY, which llama-server reads, so it never reaches the process
# list. The weights are read whole into GPU memory (--load-mode none). Each slot keeps its own
# cached prefix, so a session's 6K-token system prompt is prefilled once rather than after every
# side request; the KV pool is shared, so more slots cost no memory.
image = "ghcr.io/ggml-org/llama.cpp@sha256:5c73025f2072135ad37e306db9a57c685d8a349cfa5cb82b5c0f385b97567c94"
tier = "third-party"
review = "reviews/llamacpp-5c73025f2072.toml"
port = 8080
command = ["--host", "0.0.0.0", "--port", "8080", "--no-webui", "--load-mode", "none", "--jinja"]
# Healthy once the weights are in memory: /health, which carries no data and needs no key.
health = { probe = ["/bin/sh", "-c", "curl -fsS -o /dev/null http://127.0.0.1:8080/health"] }
# Vulkan on the render node only; it writes scratch files only under /tmp.
run = { devices = ["render"], group_add = "keep-groups", tmpfs = "/tmp" }
reserved = ["--host", "--port", "--api-key", "--api-key-file", "--webui", "--no-webui", "--load-mode", "--jinja", "--no-jinja"]

[inputs]
model = { arg = "--model" }
draft = { arg = "--model-draft" }
ctx = { arg = "--ctx-size" }
alias = { arg = "--alias" }
key = { env = "LLAMA_API_KEY" }
