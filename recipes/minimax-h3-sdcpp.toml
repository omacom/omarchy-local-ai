# MiniMax H3, which makes video with its sound, from a prompt or from a picture as its first
# frame. The pruned first/last-frame model at Q4, run in 4 steps with MiniMax's own turbo LoRA,
# P-H3's 4B text encoder in place of the 32B one so it fits beside the desktop, and the video and
# audio decoders. Its license excludes some territories; it is never recommended, only offered.
name = "MiniMax H3"
vendor = "minimax"
kind = "video"
runtime = "sdcpp"
# What a setup downloads: the files the artifacts below pin, not the runtime image.
download_gib = 22.64

[[hardware]]
gpu = "amd-strix-halo"
measured = "measurements/minimax-h3-sdcpp-strix-halo.toml"

[[hardware]]
gpu = "amd-strix-point"
measured = "measurements/minimax-h3-sdcpp-strix-point.toml"

[[artifacts]]
repo = "leejet/MiniMax-H3-GGUF"
revision = "eee1dd2f05b755b28bd1b785925cbfeebfcba9d9"
license = "other: minimax-h3-community-license-agreement"
files = ["minimax_h3_fl2va_pruned-Q4_K_M.gguf"]
model = "minimax_h3_fl2va_pruned-Q4_K_M.gguf"

[[artifacts]]
repo = "PrunaAI/P-H3-Image-Comfy"
revision = "44a0fb73f299da1bb715bdb5ff59ce3fd3c6f543"
license = "other: minimax-h3-community-license-agreement"
files = ["text_encoders/p-h3-image_text_encoder_int8_convrot.safetensors"]
text_encoder = "text_encoders/p-h3-image_text_encoder_int8_convrot.safetensors"

[[artifacts]]
repo = "Comfy-Org/MiniMax-H3"
revision = "4b53a35191437de05370da548e59aeabe2a5a09a"
license = "other: minimax-h3-community-license-agreement"
files = ["vae/minimax_h3_video_vae_fp16.safetensors", "vae/minimax_h3_audio_vae_fp32.safetensors", "loras/minimax_h3_fl2v_turbo_4step_v1.0_768p_comfyui_bf16.safetensors"]
vae = "vae/minimax_h3_video_vae_fp16.safetensors"
audio_vae = "vae/minimax_h3_audio_vae_fp32.safetensors"
lora = "loras/minimax_h3_fl2v_turbo_4step_v1.0_768p_comfyui_bf16.safetensors"

# Measured with --flash-attn on and --vae-tiling: 19.6 GiB GPU peak on Strix Halo (206 s for a
# 2.3 s 864x480 clip) and 22.4 GiB GPU peak / ~24.8 GiB RAM delta on Strix Point (385 s). That
# leaves too little headroom beside the desktop on 32 GB, so 64 GB is the floor.
[[variant]]
peak_ram_gib = 25
peak_gpu_gib = 23

# Clips are 24 fps, up to the 15 s H3 is made for. With Flash Attention and VAE tiling, peak GPU
# memory stays flat at 19.6-19.7 GiB between 56 and 124 frames, and host RAM grows by ~0.7 GiB
# over those 68 frames (~0.01 GiB/frame, budgeted at 0.02).
[video]
fps = 24
max_seconds = 15
reference_frames = 56
gib_per_frame = 0.02

# sd-server's --flash-attn auto micro-probe disables Flash Attention on RADV Vulkan0, which makes
# MiniMax H3's 3D video attention ~6.5x slower (233 s/step vs 36 s/step) and doubles peak memory.
# Forcing --flash-attn on with --vae-tiling keeps weights in unified GPU memory without CPU offload.
[server]
args = ["--cfg-scale", "1.0", "--steps", "4", "--flash-attn", "on", "--vae-tiling"]
