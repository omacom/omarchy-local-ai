# Stability AI's Stable Audio 3 Medium on sa3.cpp's CUDA build for NVIDIA's unified-memory ARM
# machines (GB10, N1x): 1.5B FP16 diffusion transformer, SAME-L FP16 audio decoder, F32
# conditioner sidecar, and shared T5Gemma 0.3B FP16 text encoder + vocab. Makes instrumental
# stereo music up to three minutes long on the GPU with frugal per-stage offloading and zero GPU
# memory held between songs.
name = "Stable Audio 3 Medium"
vendor = "stability"
kind = "music"
vocals = false
runtime = "stable-audio-3-cuda"
# What a setup downloads: the five files pinned below, not the runtime image.
download_gib = 4.83

[[hardware]]
gpu = "nvidia-n1x"
ram_class = 128
measured = "measurements/stable-audio-3-medium-cuda-n1x-128.toml"

[[artifacts]]
repo = "thepatch/stable-audio-3-medium-GGUF"
revision = "380a7b25ba6b3b12563b01193227580a9ae7dac0"
license = "other (Stability AI Community License)"
files = [
  "stable-audio-3-medium-dit-1.5B-v1.0-F16.gguf",
  "stable-audio-3-medium-same-l-v1.0-F16.gguf",
  "stable-audio-3-medium-conditioner-v1.0-F32.gguf",
]
dest = "sa3"
model = "."

[[artifacts]]
repo = "thepatch/t5gemma-b-b-ul2-GGUF"
revision = "26caadf5cb1b6523370caff61f6a32337f46625e"
license = "gemma"
files = [
  "t5gemma-b-b-ul2-encoder-0.3B-v1.0-F16.gguf",
  "t5gemma-b-b-ul2-v1.0-vocab.gguf",
]
dest = "sa3"

# Measured: 6.3 GiB of GPU memory at its peak, making a 60 s song in 5.0 s and a 180 s song in 13.5 s.
[[variant]]
peak_ram_gib = 8
peak_gpu_gib = 8
